# =============================================================================
# ADVERSARIAL AGENT PROMPT
# =============================================================================
# Pattern: Executor + Verifier
# Implementer builds scaffold tool. Reviewer challenges every decision.
# =============================================================================

[meta]
pattern = "Executor + Verifier"
source = "flowtress-docker/context/templates/adversarial-agents.html"
applies_to = "Implementation"
version = "3.0.0"

# -----------------------------------------------------------------------------
# ORCHESTRATOR INSTRUCTIONS
# -----------------------------------------------------------------------------
[orchestrator]
instruction = """
Set up two parallel agents for this implementation task.
The verifier is blocked until the executor produces a first draft.
They iterate until the Reviewer approves all verification checks.
"""

# -----------------------------------------------------------------------------
# TASK DEFINITION
# -----------------------------------------------------------------------------
[task]
summary = "Build a globally-installable `scaffold` CLI tool that creates a project root with bare git repo and 31 branch worktrees in one command."
spec_files = [
    "plan/topology.toml",
    "plan/execution.toml",
    "plan/conventions.toml",
    "plan/verification.toml",
    "spec/cli-interface.toml",
    "spec/directory-scaffold.toml",
    "spec/seed-templates.toml",
]

# -----------------------------------------------------------------------------
# AGENT 1 — IMPLEMENTER
# -----------------------------------------------------------------------------
[implementer]
name = "Implementer"
role = "Executor — builds the scaffold script"
blocked_until = "none"

[implementer.responsibilities]
primary = [
    "Read plan/topology.toml for the full 31-branch topology",
    "Read plan/execution.toml for the ordered creation phases (0–6)",
    "Read spec/cli-interface.toml for the CLI contract (signature, flags, exit codes)",
    "Read spec/directory-scaffold.toml for exact file/folder output per branch type",
    "Read spec/seed-templates.toml for starter file content",
    "Implement the scaffold script: /bin/scaffold",
    "Phase 0: Preflight (validate name, check dir doesn't exist, verify git)",
    "Phase 1: Create null + main branches as worktrees",
    "Phase 2: Create 01_rough-plan, 02_context, 02_plan as orphan worktrees",
    "Phase 3: Create ui/impeccable as orphan worktree",
    "Phase 4: Create 9 spec/* branches as orphan worktrees",
    "Phase 5: Create impl/front-end_tech-stack (orphan) + 7 front-end fork chain + 3 back-end orphans",
    "Phase 6: Create testing, staging, bug-fixes, deployment examples",
    "Seed minimal files (README.md, .gitignore, directories) per branch type",
    "Print summary on success",
]

[implementer.constraints]
must_follow = [
    "plan/conventions.toml: anti-patterns, naming rules, script conventions",
    "set -euo pipefail in all scripts",
    "Idempotent: exit 1 if .bare already exists in root",
    "Exit 0 on success, exit 1 with stderr message on failure",
]
must_not = [
    "Add features not in spec (no --dry-run, no --verbose, no flags)",
    "Over-engineer — one command, one job",
    "Create GitHub repos or push to remotes",
    "Make the script interactive (no prompts, no confirmations)",
]

# -----------------------------------------------------------------------------
# AGENT 2 — REVIEWER
# -----------------------------------------------------------------------------
[reviewer]
name = "Reviewer"
role = "Verifier — critically analyzes the implementer's output"
blocked_until = "Implementer produces first draft of scaffold script"

[reviewer.responsibilities]
primary = [
    "Wait for implementer to produce scaffold script before starting",
    "Verify scaffold creates exactly 31 branches (git --git-dir=.bare branch -a count)",
    "Verify null branch is completely empty (0 tracked files, 1 empty commit)",
    "Verify all 22 orphan branches have no parent (git merge-base returns nothing)",
    "Verify front-end fork chain integrity: typography→color-scheme→navbar→footer→app-shell→hero, app-shell→homepage",
    "Verify hero and homepage are siblings (both fork from app-shell, not from each other)",
    "Verify back-end branches are all orphans (api and db are NOT forks of tech-stack)",
    "Verify testing/front-end_navbar forks from impl/front-end_navbar",
    "Verify bug-fixes/front-end_navbar-nav-fix forks from impl/front-end_navbar",
    "Verify staging/v1, deployment/v1, deployment/v2 are orphans",
    "Verify all non-null branches have README.md",
    "Verify spec branches contain no implementation files (.ts, .js, .py, etc.)",
    "Challenge idempotency: run scaffold twice on same project — second run must exit 1",
    "Challenge edge cases: invalid project name, existing directory, git not in PATH",
    "Challenge naming: spaces in branch names, special chars, path separator correctness",
    "Verify all V.1–V.28 checks from plan/verification.toml",
    "Flag issues and send corrections back to implementer",
    "Verify fixes in subsequent review rounds",
]

[reviewer.scrutiny_areas]
branch_count = "Exactly 31 branches. No more, no less."
orphan_integrity = "22 orphans must have no merge-base with any other branch."
fork_integrity = "8 forks must have correct parent via merge-base --is-ancestor."
null_emptiness = "0 tracked files, 1 empty commit."
seed_content = "README.md on every non-null branch. .gitignore + src/ on tech-stack branches."
script_safety = "set -euo pipefail. No unquoted variables. No silent failures."
idempotency = "Re-run exits 1 with clear message."
error_handling = "Invalid name, dir exists, no git — all exit 1 with stderr message."
no_scope_creep = "No flags, no prompts, no remote operations, no application code."

# -----------------------------------------------------------------------------
# REVIEW ITERATION PROTOCOL
# -----------------------------------------------------------------------------
[iteration]
max_rounds = 3
protocol = """
1. Implementer produces scaffold script
2. Reviewer audits against scrutiny areas and verification.toml
3. Reviewer sends structured review: {file:line, issue, severity, suggested_fix}
4. Implementer addresses all issues or counters if reviewer is wrong
5. Reviewer re-audits until all issues resolved
6. When Reviewer approves, task is complete
"""

[[iteration.severity_levels]]
level = "CRITICAL"
meaning = "Wrong branch count, broken fork chain, script exits silently on error"
action = "Must fix before reviewer approves"

[[iteration.severity_levels]]
level = "MAJOR"
meaning = "Missing README on branch, wrong seed content, edge case not handled"
action = "Must fix before reviewer approves"

[[iteration.severity_levels]]
level = "MINOR"
meaning = "Style inconsistency, message wording, minor improvements"
action = "Fix if time allows"

# -----------------------------------------------------------------------------
# COMPLETION CRITERIA
# -----------------------------------------------------------------------------
[completion]
statement = "Task is complete only when the Reviewer approves."
requirements = [
    "All V.1–V.28 checks from plan/verification.toml pass",
    "Reviewer has no open CRITICAL or MAJOR issues",
    "scaffold <valid-name> creates 31 branches with correct fork relationships",
    "scaffold <valid-name> seeds correct files per branch type",
    "scaffold <existing-name> exits 1",
    "scaffold 'invalid name' exits 1",
    "Script is idempotent and follows conventions",
]
