# =============================================================================
# CHECKPOINT MARKERS
# =============================================================================
# Agents must report progress at each checkpoint. Each checkpoint has an
# expected output format so orchestrators can validate progress.
# =============================================================================

[[checkpoints]]
id = "CP.1"
trigger = "After context acquisition (preflight)"
report_format = "Found {N} existing branches, git version {v}, gh CLI available: {yes/no}, working tree: {clean/dirty}"

[[checkpoints]]
id = "CP.2"
trigger = "After Phase A completion"
report_format = """
Documentation complete:
- README.md: {exists}
- ARCHITECTURE.md: {exists}
- .gitignore: {exists}
- scripts/init-branches.sh: {exists} (stub)
Committed: {commit_hash}
"""

[[checkpoints]]
id = "CP.3"
trigger = "After init-branches.sh run (B.8)"
report_format = """
Branch topology created:
- main: {exists}
- context: {exists}
- /plan/front-end_hero: {exists}
- /spec/front-end_hero: {exists}
- impl/front-end_hero: {exists}
verify_topology() output: {pass/fail, details}
"""

[[checkpoints]]
id = "CP.4"
trigger = "After Phase C completion (all helper scripts)"
report_format = """
Helper scripts:
- scripts/new-feature.sh: {exists, executable}
- scripts/verify-topology.sh: {exists, executable, exit_code}
- .github/BRANCH_NAMING.md: {exists}
Committed: {commit_hash}
"""

[[checkpoints]]
id = "CP.5"
trigger = "After final verification (C.5)"
report_format = """
Final verification:
- verify-topology.sh exit code: {0 = pass}
- All branches present: {yes/no}
- Fork relationships: {intact/broken}
- new-feature.sh smoke test: {pass/fail}
"""

[[checkpoints]]
id = "CP.6"
trigger = "After Phase D (push + GitHub config)"
report_format = """
Template repo ready:
- All branches pushed to origin: {yes/no}
- GitHub template flag enabled: {yes/no}
- Repo URL: {url}
"""
