# =============================================================================
# EXECUTION STRATEGY
# =============================================================================
# Ordered phases with individual steps. Agents must execute SEQUENTIAL within
# each phase, but phases are PARALLEL where noted.
# =============================================================================

# -----------------------------------------------------------------------------
# PHASE A: Repository Structure & Documentation
# -----------------------------------------------------------------------------
[phase_a]
label = "Repository Structure & Documentation"
order = 1
estimated_ops = 6

[[phase_a.steps]]
id = "A.1"
action = "Create README.md on main branch"
outcome = "Template purpose documented. Branch topology map included. Quick-start instructions for using the template."
tool = "Write"
file = "README.md"

[[phase_a.steps]]
id = "A.2"
action = "Create ARCHITECTURE.md on main branch"
outcome = "Full multi-repo strategy (dev → backup → client) documented. Branch lifecycle (context → /plan/* → /spec/* → impl/*) explained. Fork relationships, naming conventions, and branch-type rules documented."
tool = "Write"
file = "ARCHITECTURE.md"

[[phase_a.steps]]
id = "A.3"
action = "Create .gitignore on main branch"
outcome = "OS files, IDE configs, and build artifacts excluded."
tool = "Write"
file = ".gitignore"

[[phase_a.steps]]
id = "A.4"
action = "Create scripts/init-branches.sh scaffold"
outcome = "Shell script skeleton created. Functions stubbed for: create_context_branch(), create_sample_triad(), verify_topology()."
tool = "Write"
file = "scripts/init-branches.sh"

[[phase_a.steps]]
id = "A.5"
action = "Make init-branches.sh executable"
outcome = "Script is runnable via ./scripts/init-branches.sh"
tool = "Bash"
command = "chmod +x scripts/init-branches.sh"

[[phase_a.steps]]
id = "A.6"
action = "Stage and commit Phase A"
outcome = "Initial commit on main with all documentation and script skeleton."
tool = "Bash"
command = "git add -A && git commit -m 'feat: template scaffolding — README, ARCHITECTURE, init script skeleton'"

# -----------------------------------------------------------------------------
# PHASE B: Bootstrap Script — Branch Creation Logic
# -----------------------------------------------------------------------------
[phase_b]
label = "Bootstrap Script — Branch Creation Logic"
order = 2
estimated_ops = 9
depends_on = "phase_a"

[[phase_b.steps]]
id = "B.1"
action = "Implement create_context_branch() in init-branches.sh"
outcome = "Script creates 'context' branch from 'main'. Seeds with: README.md, CONTEXT.md, plan/README.md, spec/README.md, .gitkeep files."
details = """
README.md: 'This branch captures all project context — no implementation lives here.'
CONTEXT.md: Template for interview/Q&A driven context gathering.
plan/README.md: 'Plan folders live here. Each maps to a /plan/* branch.'
spec/README.md: 'Spec folders live here. Each maps to a /spec/* branch.'
"""
tool = "Edit"

[[phase_b.steps]]
id = "B.2"
action = "Implement create_plan_branch() in init-branches.sh"
outcome = "Script creates /plan/<feature> branch forked from context, carrying the plan/<feature-path>/ directory scaffold."
tool = "Edit"

[[phase_b.steps]]
id = "B.3"
action = "Implement create_spec_branch() in init-branches.sh"
outcome = "Script creates /spec/<feature> branch forked from /plan/<feature>, carrying the spec scaffold."
tool = "Edit"

[[phase_b.steps]]
id = "B.4"
action = "Implement create_impl_branch() in init-branches.sh"
outcome = "Script creates impl/<feature> branch forked from /spec/<feature>, carrying the src/ scaffold."
tool = "Edit"

[[phase_b.steps]]
id = "B.5"
action = "Implement create_sample_triad() in init-branches.sh"
outcome = "Creates full sample chain: /plan/front-end_hero → /spec/front-end_hero → impl/front-end_hero"
tool = "Edit"

[[phase_b.steps]]
id = "B.6"
action = "Implement verify_topology() in init-branches.sh"
outcome = "Validates all required branches exist, checks fork relationships, reports missing or broken links."
tool = "Edit"

[[phase_b.steps]]
id = "B.7"
action = "Implement idempotency guard in init-branches.sh"
outcome = "Script checks if branches already exist before creating. Running twice produces no errors."
tool = "Edit"

[[phase_b.steps]]
id = "B.8"
action = "Run init-branches.sh to create the full topology"
outcome = "All branches created locally. Fork relationships verified by verify_topology()."
tool = "Bash"
command = "./scripts/init-branches.sh"

[[phase_b.steps]]
id = "B.9"
action = "Commit sample triad branches"
outcome = "All branches have their initial commits pushed local."
tool = "Bash"

# -----------------------------------------------------------------------------
# PHASE C: Helper Scripts & Quality Assurance
# -----------------------------------------------------------------------------
[phase_c]
label = "Helper Scripts & Quality Assurance"
order = 3
estimated_ops = 6
depends_on = "phase_b"

[[phase_c.steps]]
id = "C.1"
action = "Create scripts/new-feature.sh"
outcome = "Helper script to create a full feature branch chain: ./scripts/new-feature.sh front-end/hero → creates /plan/front-end_hero → /spec/front-end_hero → impl/front-end_hero"
tool = "Write"
file = "scripts/new-feature.sh"

[[phase_c.steps]]
id = "C.2"
action = "Create scripts/verify-topology.sh (standalone)"
outcome = "Standalone verification script that checks branch existence, fork relationships, and naming conventions without relying on init-branches.sh being run first."
tool = "Write"
file = "scripts/verify-topology.sh"

[[phase_c.steps]]
id = "C.3"
action = "Create .github/BRANCH_NAMING.md"
outcome = "Documents prefix rules (/plan/, /spec/, impl/) and their semantics for contributors."
tool = "Write"
file = ".github/BRANCH_NAMING.md"

[[phase_c.steps]]
id = "C.4"
action = "Make all scripts executable"
outcome = "new-feature.sh and verify-topology.sh are runnable."
tool = "Bash"
command = "chmod +x scripts/new-feature.sh scripts/verify-topology.sh"

[[phase_c.steps]]
id = "C.5"
action = "Run standalone verify-topology.sh"
outcome = "Script exits 0. All branches present. Fork relationships intact."
tool = "Bash"
command = "./scripts/verify-topology.sh"

[[phase_c.steps]]
id = "C.6"
action = "Final commit on main with all scripts"
outcome = "main branch complete with all scripts and documentation."
tool = "Bash"
command = "git add -A && git commit -m 'feat: helper scripts, naming convention docs, verification script'"

# -----------------------------------------------------------------------------
# PHASE D: Push & GitHub Config
# -----------------------------------------------------------------------------
[phase_d]
label = "Push & GitHub Configuration"
order = 4
estimated_ops = 3
depends_on = "phase_c"
note = "Requires GitHub remote to be configured and gh CLI authenticated."

[[phase_d.steps]]
id = "D.1"
action = "Push all branches to remote"
outcome = "All branches (main, context, /plan/front-end_hero, /spec/front-end_hero, impl/front-end_hero) available on GitHub."
tool = "Bash"
command = "git push --all origin"

[[phase_d.steps]]
id = "D.2"
action = "Mark repo as GitHub template"
outcome = "Repository appears in 'Use this template' dropdown."
tool = "Bash"
command = "gh repo edit --template"

[[phase_d.steps]]
id = "D.3"
action = "Verify template works"
outcome = "Clone from template, run init-branches.sh, confirm topology."
tool = "Bash"
command = "gh repo create test-template-clone --template <repo-name> && cd test-template-clone && ./scripts/init-branches.sh && ./scripts/verify-topology.sh"
