# =============================================================================
# VERIFICATION PLAN — 31 branches
# =============================================================================
# All checks must pass before scaffold is considered complete.
# =============================================================================

# --- BRANCH EXISTENCE ---

[[verify]]
id = "V.1"
name = "Branch count"
command = "git --git-dir=.bare branch -a | wc -l"
expect = "31 (or 31 + remote refs if pushed)"

[[verify]]
id = "V.2"
name = "null branch exists and is empty"
command = "git -C null rev-list --count HEAD && git -C null ls-files | wc -l"
expect = "1 commit, 0 tracked files"

[[verify]]
id = "V.3"
name = "main branch exists"
command = "git --git-dir=.bare show-ref --verify refs/heads/main"
expect = "Non-empty ref"

# --- PLANNING BRANCHES ---

[[verify]]
id = "V.4"
name = "01_rough-plan exists"
command = "git --git-dir=.bare show-ref --verify refs/heads/01_rough-plan"

[[verify]]
id = "V.5"
name = "02_context exists"
command = "git --git-dir=.bare show-ref --verify refs/heads/02_context"

[[verify]]
id = "V.6"
name = "02_plan exists"
command = "git --git-dir=.bare show-ref --verify refs/heads/02_plan"

# --- STANDARDS ---

[[verify]]
id = "V.7"
name = "ui/impeccable exists"
command = "git --git-dir=.bare show-ref --verify refs/heads/ui/impeccable"

# --- SPEC BRANCHES (9) ---

[[verify]]
id = "V.8"
name = "All 9 spec branches exist"
command = """
for b in spec/front-end_tech-stack spec/back-end_tech-stack \
         spec/front-end_typography spec/front-end_color-scheme \
         spec/front-end_navbar spec/front-end_footer \
         spec/front-end_app-shell spec/front-end_hero \
         spec/front-end_homepage; do
    git --git-dir=.bare show-ref --verify "refs/heads/$b" || exit 1
done
"""

[[verify]]
id = "V.9"
name = "Spec branches contain no implementation files"
command = "find spec/ -name '*.ts' -o -name '*.js' -o -name '*.py' -o -name '*.go' -o -name '*.rs' -o -name '*.java'"
expect = "No output"

# --- ORPHAN INTEGRITY ---

[[verify]]
id = "V.10"
name = "22 orphan branches have no parent (no merge base with any other branch)"
command = """
# Orphan list from topology.toml:
for orphan in null main 01_rough-plan 02_context 02_plan ui/impeccable \
              spec/front-end_tech-stack spec/back-end_tech-stack \
              spec/front-end_typography spec/front-end_color-scheme \
              spec/front-end_navbar spec/front-end_footer \
              spec/front-end_app-shell spec/front-end_hero spec/front-end_homepage \
              impl/front-end_tech-stack impl/back-end_tech-stack \
              impl/back-end_api impl/back-end_db \
              staging/v1 deployment/v1 deployment/v2; do
    git --git-dir=.bare show-ref --verify "refs/heads/$orphan" || echo "MISSING: $orphan"
done
"""

