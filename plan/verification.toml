# --- README PRESENCE ---

[[verify]]
id = "V.26"
name = "All non-null branches have README.md"
command = """
for b in main 01_rough-plan 02_context 02_plan ui/impeccable \
         spec/front-end_tech-stack spec/back-end_tech-stack \
         spec/front-end_typography spec/front-end_color-scheme \
         spec/front-end_navbar spec/front-end_footer \
         spec/front-end_app-shell spec/front-end_hero spec/front-end_homepage \
         impl/front-end_tech-stack impl/front-end_typography impl/front-end_color-scheme \
         impl/front-end_navbar impl/front-end_footer impl/front-end_app-shell \
         impl/front-end_hero impl/front-end_homepage \
         impl/back-end_tech-stack impl/back-end_api impl/back-end_db \
         testing/front-end_navbar staging/v1 \
         bug-fixes/front-end_navbar-nav-fix deployment/v1 deployment/v2; do
    git show "$b:README.md" -- >/dev/null 2>&1 || echo "MISSING README: $b"
done
"""
expect = "No MISSING output"

