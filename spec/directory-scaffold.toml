# =============================================================================
# DIRECTORY SCAFFOLD — per branch type
# =============================================================================
# Exact folder/file output for each branch type when scaffold runs.
# =============================================================================

[utility.null]
branch = "null"
type = "orphan"
directories = []
files = []
notes = "Completely empty. No files, no README. Purpose: duplication source."

[utility.main]
branch = "main"
type = "orphan"
directories = []
files = ["README.md"]
notes = "Placeholder only. Full scaffold scripts added later."

[planning."01_rough-plan"]
branch = "01_rough-plan"
type = "orphan"
directories = []
files = ["README.md"]
readme_content = "# 01 Rough Plan\n\nBrainstorming space for rough idea, MVP scope, and future releases."

[planning."02_context"]
branch = "02_context"
type = "orphan"
directories = []
files = ["README.md"]
readme_content = "# 02 Context\n\nPrecise scope setting. Uses flowtress-docker/context for interview Q&A and skill gathering."

[planning."02_plan"]
branch = "02_plan"
type = "orphan"
directories = ["plan/"]
files = ["README.md"]
readme_content = "# 02 Plan\n\nDetailed MVP plan. Demarcated into subfolders with .md + .toml formats."

[standards."ui/impeccable"]
branch = "ui/impeccable"
type = "orphan"
directories = []
files = ["README.md"]
readme_content = "# UI Standards\n\nSource: https://github.com/pbakaus/impeccable\n\nAnti-patterns and standards for all UI regardless of platform and tech-stack."

[spec.star]
pattern = "spec/*"
type = "orphan"
directories = ["spec/"]
files = ["README.md"]
readme_content = "# <Feature> Spec\n\nSpecification for <feature>. Defines code behavior, branding, UX copy, anti-patterns."
notes = "No implementation code on spec branches. Pure specification."

[impl.orphan_tech_stack]
pattern = "impl/*-tech-stack"
type = "orphan"
directories = ["src/"]
files = ["README.md", ".gitignore"]
readme_content = "# <Tech Stack>\n\nBoilerplate to confirm dependencies work together. Agents should not customize this branch."
notes = "Place to resolve dependency conflicts before implementation. Should run on localhost."

[impl.fork_chain]
pattern = "impl/front-end_<feature>"
type = "fork"
directories = ["src/"]
files = ["README.md"]
readme_content = "# <Feature> Implementation\n\nForked from <parent>. Strips previous boilerplate and adds <feature> code."
notes = "Each fork strips boilerplate from parent, adds its own concern. Influenced by ui/impeccable."

[impl.back_end_orphan]
pattern = "impl/back-end_<feature>"
type = "orphan"
directories = ["src/"]
files = ["README.md"]
readme_content = "# Back-End: <Feature>\n\nImplementation of <feature>. Standalone orphan. Info from spec/back-end_tech-stack."

[qa.testing]
pattern = "testing/*"
type = "fork"
directories = []
files = ["README.md"]
readme_content = "# Tests: <Feature>\n\nTests for <feature>. Only made if testing is necessary."

[qa.staging]
pattern = "staging/*"
type = "orphan"
directories = []
files = ["README.md"]
readme_content = "# Staging: <version>\n\nIntegration staging. Merges impl/ branches for testing."

[qa.bug_fixes]
pattern = "bug-fixes/*"
type = "fork"
directories = []
files = ["README.md"]
readme_content = "# Bug Fix: <description>\n\nBug fix branch forked from <parent>."

[qa.deployment]
pattern = "deployment/*"
type = "orphan"
directories = []
files = ["README.md"]
readme_content = "# Deployment: <version>\n\nProduction-ready code. Merged from bug-fixes/ + staging/."
