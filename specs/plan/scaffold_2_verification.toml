command = "git --git-dir=\"<project-name>_root/.bare\" show-ref --verify refs/heads/01_rough-plan"

[[verify]]
id = "V.5"
name = "02_context exists"
command = "git --git-dir=\"<project-name>_root/.bare\" show-ref --verify refs/heads/02_context"

[[verify]]
id = "V.6"
