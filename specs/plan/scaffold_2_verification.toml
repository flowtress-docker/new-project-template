# --- BRANCH EXISTENCE ---

[[verify]]
id = "V.1"
name = "Branch count"
command = "git --git-dir=\"<project-name>_root/.bare\" branch -a | wc -l"
expect = "31 (or 31 + remote refs if pushed)"

[[verify]]
id = "V.2"
name = "null branch exists and is empty"
command = "git -C \"<project-name>_root/null\" rev-list --count HEAD && git -C \"<project-name>_root/null\" ls-files | wc -l"
expect = "1 commit, 0 tracked files"

[[verify]]
id = "V.3"
name = "main branch exists"
command = "git --git-dir=\"<project-name>_root/.bare\" show-ref --verify refs/heads/main"
expect = "Non-empty ref"

# --- PLANNING BRANCHES ---

[[verify]]
id = "V.4"
