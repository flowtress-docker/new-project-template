name = "ui/impeccable exists"
command = "git --git-dir=\"<project-name>_root/.bare\" show-ref --verify refs/heads/ui/impeccable"

# --- SPEC BRANCHES (9) ---

[[verify]]
id = "V.8"
name = "All 9 spec branches exist"
command = """
for b in spec/front-end_tech-stack spec/back-end_tech-stack \\
         spec/front-end_typography spec/front-end_color-scheme \\
         spec/front-end_navbar spec/front-end_footer \\
         spec/front-end_app-shell spec/front-end_hero \\
         spec/front-end_homepage; do
    git --git-dir=\"<project-name>_root/.bare\" show-ref --verify \"refs/heads/$b\" || exit 1
done
"""

[[verify]]
id = "V.9"
name = "Spec branches contain no implementation files"
command = "find \"<project-name>_root/spec/\" -name '*.ts' -o -name '*.js' -o -name '*.py' -o -name '*.go' -o -name '*.rs' -o -name '*.java'"
expect = "No output"

# --- TESTING BRANCHES (8 forks of spec) ---

[[verify]]
id = "V.10"
name = "All 8 testing branches exist"
command = """
for b in testing/front-end_typography testing/front-end_color-scheme \\
         testing/front-end_navbar testing/front-end_footer \\
         testing/front-end_app-shell testing/front-end_hero \\
         testing/front-end_homepage testing/back-end_tech-stack; do
    git --git-dir=\"<project-name>_root/.bare\" show-ref --verify \"refs/heads/$b\" || exit 1
done
"""

[[verify]]
id = "V.11"
name = "Each testing branch is child of its spec parent"
command = """
for pair in testing/front-end_typography:spec/front-end_typography \\
            testing/front-end_color-scheme:spec/front-end_color-scheme \\
            testing/front-end_navbar:spec/front-end_navbar \\
            testing/front-end_footer:spec/front-end_footer \\
            testing/front-end_app-shell:spec/front-end_app-shell \\
            testing/front-end_hero:spec/front-end_hero \\
            testing/front-end_homepage:spec/front-end_homepage \\
            testing/back-end_tech-stack:spec/back-end_tech-stack; do
    testing_branch=$(echo \"$pair\" | cut -d: -f1)
    spec_branch=$(echo \"$pair\" | cut -d: -f2)
    git --git-dir=\"<project-name>_root/.bare\" merge-base --is-ancestor \"$spec_branch\" \"$testing_branch\" || exit 1
done
"""

# --- ORPHAN INTEGRITY (main and null excluded) ---

[[verify]]
id = "V.12"
name = "20 orphan branches have no merge-base with main"
command = """
for orphan in 01_rough-plan 02_context 02_plan ui/impeccable \\
              spec/front-end_tech-stack spec/back-end_tech-stack \\
              spec/front-end_typography spec/front-end_color-scheme \\
              spec/front-end_navbar spec/front-end_footer \\
              spec/front-end_app-shell spec/front-end_hero spec/front-end_homepage \\
              impl/front-end_tech-stack impl/front-end_app-shell \\
              impl/back-end_tech-stack \\
              deployment/v1 deployment/v2; do
    if git --git-dir=\"<project-name>_root/.bare\" merge-base \"refs/heads/$orphan\" refs/heads/main >/dev/null 2>&1; then
        echo \"FAIL: $orphan shares history with main\"
        exit 1
    fi
done
echo \"All 20 orphan branches verified: no shared history with main\"
"""

