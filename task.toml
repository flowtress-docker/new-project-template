[task]
name = "Implement Recurring Dev Repo Branch Topology as GitHub Template"
type = "Implementation"
complexity = "High"
estimated_operations = "18-25"

[task.scope.include]
dev_repo = true
backup_repo = false
client_repo = false

[task.scope.format]
type = "GitHub Template Repo"
bootstrap = "Shell script (scripts/init-branches.sh)"
feature_helper = "Shell script (scripts/new-feature.sh)"
verifier = "Shell script (scripts/verify-topology.sh)"

[task.goal]
summary = """
Create a GitHub repository template that establishes a recurring branch topology
for software engineering projects. The template includes a bootstrap script to
create the full branch structure in one command, plus scaffolding and documentation
on every branch.
"""
outcome = "A GitHub template repo with full branch topology, bootstrap scripts, and documentation — ready to fork for any new project."
