# =============================================================================
# BRANCH TOPOLOGY SPECIFICATION
# =============================================================================
# Defines all branches, their fork relationships, naming conventions,
# and what content belongs on each branch type.
# =============================================================================

[branches.main]
description = "Default branch created by GitHub. Contains README, bootstrap scripts, and template documentation only."
parent = "none"
forked_from = "none"
is_tip = false

[branches.context]
description = "Captures all project context via interview-style Q&A. Stores skills, plans, specs as files. No implementation code."
parent = "main"
forked_from = "main"
is_tip = false
seeds_with = [
    "README.md",
    "CONTEXT.md",
    "plan/README.md",
    "spec/README.md",
    ".gitkeep"
]

[branches._plan_star]
pattern = "/plan/*"
description = "Feature-level planning branch. Carries context:/plan/<feature-path>/ scaffold as starting point. Refinement commits only."
parent = "context"
forked_from = "context"
is_tip = false
naming_rule = "Feature path separators become underscores. E.g., front-end/hero -> /plan/front-end_hero"

[branches._spec_star]
pattern = "/spec/*"
description = "Specification branch forked from corresponding /plan/* branch. Contains visual specs, wireframes, requirements. No implementation."
parent = "/plan/*"
forked_from = "/plan/*"
is_tip = false
naming_rule = "Must match the /plan/* branch name exactly. E.g., /plan/front-end_hero -> /spec/front-end_hero"

[branches.impl_star]
pattern = "impl/*"
description = "Implementation branch forked from corresponding /spec/* branch. Contains actual source code."
parent = "/spec/*"
forked_from = "/spec/*"
is_tip = true
naming_rule = "Must match the /spec/* branch name exactly. E.g., /spec/front-end_hero -> impl/front-end_hero"

# -----------------------------------------------------------------------------
# FORK CHAIN (visual)
# -----------------------------------------------------------------------------
# main
#  └── context (fork from main)
#        ├── /plan/front-end_hero (fork from context)
#        │     └── /spec/front-end_hero (fork from /plan/*)
#        │           └── impl/front-end_hero (fork from /spec/*)
#        └── /plan/<feature> ... (additional feature chains)
# -----------------------------------------------------------------------------

[[topology.fork_chains]]
name = "main → context"

[[topology.fork_chains]]
name = "context → /plan/*"

[[topology.fork_chains]]
name = "/plan/* → /spec/*"

[[topology.fork_chains]]
name = "/spec/* → impl/*"

# -----------------------------------------------------------------------------
# SAMPLE TRIAD (demonstrates one full feature chain)
# -----------------------------------------------------------------------------
[[topology.sample_chains]]
feature_name = "front-end_hero"
feature_path = "front-end/hero"
plan_branch = "/plan/front-end_hero"
spec_branch = "/spec/front-end_hero"
impl_branch = "impl/front-end_hero"

# -----------------------------------------------------------------------------
# DIRECTORY SCAFFOLD PER BRANCH TYPE
# -----------------------------------------------------------------------------
[scaffold.main]
directories = ["scripts/"]
files = ["README.md", "ARCHITECTURE.md", ".gitignore"]

[scaffold.context]
directories = ["plan/", "spec/", "context/interviews/"]
files = ["README.md", "CONTEXT.md"]

[scaffold._plan_star]
directories = ["plan/"]
files = ["README.md"]
inherits_from = "context:/plan/<feature-path>/"

[scaffold._spec_star]
directories = ["spec/"]
files = ["README.md"]
explicit_note = "No implementation code allowed on spec branches."

[scaffold.impl_star]
directories = ["src/"]
files = ["README.md"]
explicit_note = "Implementation code starts here. Forked after specs are confirmed."
